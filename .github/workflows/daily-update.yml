name: Daily AI News Update

on:
  schedule:
    - cron: '0 22 * * *' # 毎日 22:00 UTC = 翌 07:00 JST に自動実行
  workflow_dispatch: # GitHub画面から手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # コミット・プッシュに必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate AI News site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/generate_website.py --force

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes"
          else
            git commit -m "Auto update: $(date '+%Y-%m-%d')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHANGED="${{ steps.commit.outputs.changed }}"
          if [ "$CHANGED" = "true" ]; then
            MSG="✅ AI速報ジャパン 更新完了 $(date '+%Y-%m-%d %H:%M JST')%0A%0A新しい記事が公開されました%0Ahttps://t307239.github.io/ai-news-japan/"
          else
            MSG="ℹ️ AI速報ジャパン $(date '+%Y-%m-%d %H:%M JST')%0A本日は更新なし（新規記事なし）"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$MSG"

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ AI速報ジャパン 自動更新失敗 $(date '+%Y-%m-%d %H:%M JST')%0A詳細: https://github.com/t307239/ai-news-japan/actions"
